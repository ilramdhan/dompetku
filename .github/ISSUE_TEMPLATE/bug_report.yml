name: 🐛 Bug report
description: Something in Dompetku is broken or behaves unexpectedly.
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please check the [FAQ](https://github.com/ilramdhan/dompetku/blob/main/docs/FAQ.md) and [existing issues](https://github.com/ilramdhan/dompetku/issues?q=is%3Aissue) first.

        > **Security issue?** Do not file it here — follow [SECURITY.md](https://github.com/ilramdhan/dompetku/blob/main/SECURITY.md) instead.

        **Never paste secrets** (API keys, passwords, `SESSION_SECRET`, Supabase keys, bot tokens, chat IDs) or real financial data. Replace them with placeholders.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and short description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact steps so someone else can see the same problem.
      placeholder: |
        1. Go to "Transactions"
        2. Click "Add"
        3. Fill in ... and press "Save"
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What happened instead? Include the exact error message if there is one.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: The commit of `main` you are running (on GitHub, your fork's latest commit hash, e.g. `814bdd3`), or the date you last updated.
      placeholder: "814bdd3"
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Where is it running?
      options:
        - Vercel
        - Lovable
        - Local (bun/npm run dev)
        - Other
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Which part is affected?
      multiple: true
      options:
        - Web app
        - Telegram bot
        - n8n workflows (reminders, backup, email)
        - Receipt OCR / AI
        - Login / two-step verification
        - Database / schema
        - Installation / deployment
        - Other
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      description: For web app issues.
      placeholder: "Chrome 140 on Android 15 / Safari on iPhone / Firefox on Windows"
  - type: input
    id: schema
    attributes:
      label: Schema sections run
      description: Which sections of `supabase/schema.sql` have you run on your Supabase project? (e.g. "base + v2–v13")
      placeholder: "base + v2–v13"
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Relevant output from Vercel → your project → Logs, the browser console (F12 → Console), or n8n executions.
        **Redact secrets, chat IDs, domains and amounts.** This will be formatted as code automatically.
      render: shell
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots (with amounts hidden — privacy mode helps), related issues, or ideas about the cause.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this has not been reported yet.
          required: true
        - label: I removed all secrets and personal data from this report.
          required: true
